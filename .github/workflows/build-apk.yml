name: Build Android APK and attach to Release

on:
  push:
    tags:
      - 'v*.*.*'   # run only when a tag like v0.1.0 is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-levels: 34
          build-tools: '34.0.0'
          components: 'platform-tools,build-tools;34.0.0,platforms;android-34'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradle (if you commit a wrapper later)
        run: chmod +x gradlew || true

      - name: Build Release APK
        run: |
          # Use gradle (setup-gradle provides gradle), build release
          gradle assembleRelease --no-daemon

      - name: Locate APK
        run: |
          echo "Find APKs:"
          find . -type f -name "*.apk" -print

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app/build/outputs/apk/release/app-release-unsigned.apk
          asset_name: app-release-unsigned.apk
          asset_content_type: application/vnd.android.package-archive
