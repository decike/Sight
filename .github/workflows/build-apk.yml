name: Build Android APK and attach to Release

on:
  push:
    tags:
      - 'v*.*.*'   # run only when a tag like v0.1.0 is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-levels: 34
          build-tools: '34.0.0'
          components: 'platform-tools,build-tools;34.0.0,platforms;android-34'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: |
          echo "Find APKs:"
          find . -type f -name "*.apk" -print

      - name: Copy and rename APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Sight-${{ github.ref_name }}-app-release-unsigned.apk || true

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Sight-${{ github.ref_name }}-app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
