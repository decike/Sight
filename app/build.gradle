plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.decike.sight'
    compileSdk 34

    defaultConfig {
        applicationId "com.decike.sight"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.3.13"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        // debug 保持原样（用于本地调试）
        debug {
            storeFile file("debug.keystore") // 默认自动使用系统 debug 证书
        }

        // release 签名：从环境变量读取
        release {
            // 如果环境变量 KEYSTORE_BASE64 存在，说明在 GitHub Actions 中运行
            if (System.getenv("KEYSTORE_BASE64") != null) {
                storeFile file("$rootDir/decike_keystore.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                // 本地构建时可以 fallback 到 debug 证书（避免报错）
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release   // 改为使用 release 签名
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
